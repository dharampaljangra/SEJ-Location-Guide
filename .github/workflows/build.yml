name: Build SEJ Location Guide

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test rules (IRPWM / CT-48)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run unit tests
        run: dotnet test tests/SejGuide.Tests/SejGuide.Tests.csproj -c Release --logger "console;verbosity=normal"

  windows:
    name: Windows exe
    needs: test
    runs-on: windows-latest
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Publish Windows app (unpackaged, self-contained)
        run: >
          dotnet publish src/SejGuide.App/SejGuide.App.csproj
          -f net10.0-windows10.0.19041.0 -c Release
          -p:RuntimeIdentifierOverride=win-x64
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:SelfContained=true
          -o publish/windows
      - name: Sign Windows exe and app DLLs
        if: env.WINDOWS_PFX_BASE64 != '' && env.SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sejguide.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $files = @('SejGuide.exe', 'SejGuide.dll', 'SejGuide.Core.dll') | ForEach-Object { Join-Path 'publish/windows' $_ } | Where-Object { Test-Path $_ }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /d "SEJ Location Guide" @files
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          foreach ($f in $files) { $sig = Get-AuthenticodeSignature $f; Write-Host "$f signed by: $($sig.SignerCertificate.Subject)" }
          Copy-Item signing/SEJ-Location-Guide-Certificate.cer publish/windows/
          Copy-Item signing/SEJ-Location-Guide-Certificate.cer SEJ-Location-Guide-Certificate.cer
      - name: Warn if not signed
        if: env.WINDOWS_PFX_BASE64 == '' || env.SIGNING_PASSWORD == ''
        run: echo "::warning::WINDOWS_PFX_BASE64 / SIGNING_PASSWORD secrets not set - Windows exe is NOT signed"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/windows/* -DestinationPath SEJ-Location-Guide-Windows.zip
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source }
          & $iscc /Qp "/DMyAppVersion=1.0.${{ github.run_number }}" installer/SejGuide.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Copy-Item installer-output/SEJ-Location-Guide-Setup.exe SEJ-Location-Guide-Setup.exe
      - name: Sign installer
        if: env.WINDOWS_PFX_BASE64 != '' && env.SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sejguide.pfx'
          & $env:SIGNTOOL sign /fd SHA256 /f $pfx /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /d "SEJ Location Guide Setup" SEJ-Location-Guide-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          $sig = Get-AuthenticodeSignature SEJ-Location-Guide-Setup.exe
          Write-Host "SEJ-Location-Guide-Setup.exe signed by: $($sig.SignerCertificate.Subject)"
      - name: Remove signing key from runner
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'sejguide.pfx') -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: SEJ-Location-Guide-Windows
          path: |
            SEJ-Location-Guide-Setup.exe
            SEJ-Location-Guide-Windows.zip
            SEJ-Location-Guide-Certificate.cer
          if-no-files-found: warn

  android:
    name: Android apk
    needs: test
    runs-on: windows-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Decode Android keystore
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.SIGNING_PASSWORD != ''
        shell: pwsh
        run: |
          $ks = Join-Path $env:RUNNER_TEMP 'sejguide.keystore'
          [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          "SIGN_ARGS=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$ks -p:AndroidSigningKeyAlias=sejguide -p:AndroidSigningKeyPass=env:SIGNING_PASSWORD -p:AndroidSigningStorePass=env:SIGNING_PASSWORD" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Warn if not signed
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.SIGNING_PASSWORD == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 / SIGNING_PASSWORD secrets not set - apk signed with a temporary debug key"
      - name: Publish Android apk
        run: >
          dotnet publish src/SejGuide.App/SejGuide.App.csproj
          -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk
          ${{ env.SIGN_ARGS }}
          -o publish/android
      - name: Rename apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem publish/android -Filter *-Signed.apk | Select-Object -First 1
          Copy-Item $apk.FullName SEJ-Location-Guide.apk
          keytool -printcert -jarfile SEJ-Location-Guide.apk | Select-String 'Owner|SHA256:' | Select-Object -First 2
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'sejguide.keystore')) { Remove-Item (Join-Path $env:RUNNER_TEMP 'sejguide.keystore') -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: SEJ-Location-Guide-Android
          path: SEJ-Location-Guide.apk

  release:
    name: Publish release
    needs: [ windows, android ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SEJ Location Guide v1.0.${{ github.run_number }}
          body: |
            SEJ Location Guide – IRPWM 2024 (ACS-16) & RDSO CT-48 (Nov 2025).
            DHARAM PAL JANGID, Senior Section Engineer (P.Way) Kota Division of WCRly

            * **Windows (recommended):** download `SEJ-Location-Guide-Setup.exe` and run it. It installs to Program Files, adds Start menu / desktop shortcuts, and can be removed from Settings → Apps.
            * **Windows (portable, no install):** download `SEJ-Location-Guide-Windows.zip`, extract it, and run `SejGuide.exe`.
            * **Android:** download `SEJ-Location-Guide.apk`, open it, and allow "Install unknown apps" when asked.

            All files are digitally signed by Dharam Pal Jangid. To stop the "Unknown publisher" warning, tick
            "Trust the publisher certificate" during setup, or install `SEJ-Location-Guide-Certificate.cer`
            (Install Certificate → Local Machine → "Trusted Root Certification Authorities", then again in "Trusted Publishers").
          files: |
            dist/SEJ-Location-Guide-Setup.exe
            dist/SEJ-Location-Guide-Windows.zip
            dist/SEJ-Location-Guide.apk
            dist/SEJ-Location-Guide-Certificate.cer
